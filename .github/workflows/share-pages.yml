# 업체 공유 미리보기(카톡·네이버) 자동 갱신
# 1시간마다, 그리고 코드가 바뀔 때마다 DB의 업체 정보를 읽어 s/ 와 og/ 를 다시 만들어요.
name: share-previews
on:
  push:
    branches: [main]
    paths-ignore: ["s/**", "og/**", "c/**", "en/**", "p/**", "blog/**", "data/osm.json", "sitemap.xml", "llms.txt"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "사이트맵의 모든 페이지를 빙 · IndexNow 에 한 번에 알리기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: share-previews, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 글꼴·Pillow 설치
        run: |
          # 우분투 서버가 잠깐 안 될 때가 있어서 3번까지 다시 해요
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra >/dev/null && break
            echo "글꼴 설치 실패 ($i/3), 30초 뒤 다시"; sleep 30
          done
          pip install -q pillow
      - name: 🔗 포털에 넣은 링크에서 가게 정보 가져오기 (수집 열쇠가 있을 때만)
        env:
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
        run: python3 tools/crawl.py || echo "링크 가져오기 건너뜀"
      - name: 미입점 업체 공개 지도 정보 (오픈스트리트맵, 일주일에 한 번)
        run: python3 tools/osm-fetch.py || echo "OSM 건너뜀"
      - name: 미리보기 만들기
        run: |
          node tools/share-dump.js "$RUNNER_TEMP/share.json"
          python3 tools/share-build.py "$RUNNER_TEMP/share.json"
      - name: 바뀐 것만 올리기
        run: |
          git add -A s og c en p blog sitemap.xml llms.txt; [ -f data/osm.json ] && git add data/osm.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
          git config user.name "uncleday-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "공유 미리보기 자동 갱신"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: 빙 · IndexNow 에 바뀐 페이지 알리기
        run: |
          if [ "${{ inputs.indexnow_all }}" = "true" ]; then sleep 60; python3 tools/indexnow.py --all; exit 0; fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then sleep 90; python3 tools/indexnow.py "$RUNNER_TEMP/changed.txt"; else echo "알릴 것 없음"; fi
      - name: 🔎 구글 색인 상태 확인 (매시간 70개 · 구글 하루 한도 2,000건 안)
        if: github.event_name == 'schedule'
        env:
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
        run: |
          [ -n "$CRAWL_TOKEN" ] || { echo "CRAWL_TOKEN 없음 — 건너뜀"; exit 0; }
          U=$(grep -o 'url: *"[^"]*"' config.js | head -1 | sed 's/.*"\(.*\)"/\1/'); K=$(grep -o 'key: *"[^"]*"' config.js | head -1 | sed 's/.*"\(.*\)"/\1/')
          curl -s -m 150 -X POST "$U/functions/v1/gsc" -H "apikey: $K" -H "Content-Type: application/json" -H "x-crawl-token: $CRAWL_TOKEN" -d '{"action":"sweep","n":70}' | head -c 400 || true
