# 업체 공유 미리보기(카톡·네이버) 자동 갱신
# 3시간마다, 그리고 코드가 바뀔 때마다 DB의 업체 정보를 읽어 s/ 와 og/ 를 다시 만들어요.
name: share-previews
on:
  push:
    branches: [main]
    paths-ignore: ["s/**", "og/**", "sitemap.xml"]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: share-previews, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 글꼴·Pillow 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra >/dev/null
          pip install -q pillow
      - name: 미리보기 만들기
        run: |
          node tools/share-dump.js "$RUNNER_TEMP/share.json"
          python3 tools/share-build.py "$RUNNER_TEMP/share.json"
      - name: 바뀐 것만 올리기
        run: |
          git add -A s og sitemap.xml
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "uncleday-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "공유 미리보기 자동 갱신"
          git pull -q --rebase origin main && git push -q origin HEAD:main
