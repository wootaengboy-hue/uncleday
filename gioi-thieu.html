<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uncle Day · Giới thiệu cho cửa hàng</title>
<meta name="robots" content="noindex">
<meta name="description" content="Uncle Day đưa khách du lịch quốc tế đến cửa hàng. Khách đặt lịch bằng ngôn ngữ của họ, cửa hàng chỉ cần bấm nhận lịch trên Zalo.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Uncle Day">
<meta property="og:title" content="Uncle Day · Giới thiệu cho cửa hàng">
<meta property="og:description" content="Đưa khách du lịch quốc tế đến cửa hàng của anh/chị. Chỉ trả phí khi khách đã đến và thanh toán.">
<meta property="og:image" content="https://www.uncleday.com/images/og-partner.jpg?v=2">
<meta name="theme-color" content="#116241">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
:root{--g:#116241;--g2:#0B4A31;--navy:#0E2843;--cream:#FAF3E0;--paper:#FFFCF4;--sub:#4A5568;--or:#FD6A00;--ord:#B24700;--mint:#E3F1E8;--line:#EADFC6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--navy);font-family:"Be Vietnam Pro","Noto Sans KR",-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body.ko{font-family:"Noto Sans KR","Be Vietnam Pro",-apple-system,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
/* 한국어는 기본으로 글자 단위로 줄이 바뀌어서('보내/드려요') 띄어쓰기 단위로만 바꿔요 · 제목은 줄 길이를 고르게 */
h1,h2{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:fixed;inset:0 0 auto;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:5;background:rgba(250,243,224,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top img{height:34px}
.top .grow{flex:1}
.lg{display:flex;gap:4px}
.lg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-weight:800;font-size:13px}
.lg button.on{background:var(--g);border-color:var(--g);color:#fff}
.cnt{font-size:13px;font-weight:700;color:var(--sub);min-width:42px;text-align:right}
.deck{position:fixed;inset:56px 0 72px;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:22px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sl>*{width:100%;max-width:720px;margin-left:auto!important;margin-right:auto!important}
.sl>.pill{width:auto;align-self:flex-start;margin-left:max(0px,calc((100% - 720px) / 2))!important;margin-right:0!important}
.sl.dark{background:var(--g);color:var(--cream)}
.eb{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ord);margin:0}
.dark .eb{color:#FFC08A}
h1{font-size:30px;line-height:1.22;margin:0;font-weight:800}
h2{font-size:24px;line-height:1.28;margin:0;font-weight:800}
p{margin:0;font-size:16px;line-height:1.55}
.lead{font-size:18px;color:var(--sub)}
.dark .lead{color:#D9EDE2}
.pill{display:inline-block;align-self:flex-start;background:var(--or);color:var(--navy);font-weight:800;padding:10px 18px;border-radius:999px;font-size:15px}
.big{font-size:56px;font-weight:800;color:var(--g);line-height:1;letter-spacing:-1px}
.src{font-size:12px;color:var(--sub)}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mk>div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 6px;display:grid;justify-items:center;gap:1px;text-align:center}.mk span{font-size:20px;line-height:1.1}.mk b{font-size:13px}.mk em{font-style:normal;font-size:12px;color:var(--g);font-weight:800}
.cards{display:grid;gap:10px}
.card{background:var(--paper);color:var(--navy);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:start}
.card .ic{grid-row:span 2;font-size:28px;line-height:1.1}
.card b{font-size:17px;line-height:1.35}
.card small{font-size:14.5px;color:var(--sub);line-height:1.5}
.card.hi{background:var(--mint);border-color:#BFDCC9}
.card .n{grid-row:span 2;width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.who{display:block;font-size:12px;font-weight:800;color:var(--ord);letter-spacing:.04em}
.ph{background:var(--navy);border-radius:28px;padding:8px;width:min(62vw,240px);margin:0 auto}
.ph img{display:block;width:100%;aspect-ratio:1/2;object-fit:cover;border-radius:21px;background:#fff}
.phs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.phs figure{margin:0;flex:0 0 auto;display:grid;gap:6px;justify-items:center}
.phs .ph{width:min(42vw,200px)}
.phs figcaption{font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
td:first-child{font-weight:800;width:40%;padding-right:10px}
.ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ft a{color:inherit}
.nav{position:fixed;inset:auto 0 0;height:72px;padding:0 12px calc(env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:var(--paper);border-top:1px solid var(--line);z-index:5}
.nav button.b{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#EFE6CF;min-width:76px}
.nav button.b.go{background:var(--g);color:#fff}
.nav button.b:disabled{opacity:.35}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#D8CCAE}
.dots i.on{background:var(--g);width:20px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;font-size:14px}
@media (min-width:900px){
  .sl{padding:36px 40px}
  h1{font-size:44px}h2{font-size:32px}p{font-size:18px}.lead{font-size:21px}.big{font-size:80px}
  .cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c4{grid-template-columns:repeat(2,1fr)}
  .sl{justify-content:center}
  .split{display:grid;grid-template-columns:1fr 260px;gap:32px;align-items:center}
}
</style>
</head>

      demo: T("▶ Xem thử trang quản lý cửa hàng", "▶ 사장님 페이지 체험해 보기") },
    { eb: T("CÂU HỎI THƯỜNG GẶP", "자주 묻는 것"), h2: T("Chủ cửa hàng hay hỏi", "사장님이 자주 물어요"),
      faq: [[T("Tôi không biết tiếng nước ngoài?", "외국어를 몰라요"), T("Không sao. Tin nhắn, trang quản lý đều bằng tiếng Việt; Uncle Day nói chuyện với khách.", "괜찮아요. 메시지 · 관리 화면은 베트남어이고, 손님 응대는 엉클데이가 해요.")],
        [T("Có cần máy tính không?", "컴퓨터가 필요해요?"), T("Không. Chỉ cần điện thoại có Zalo.", "아니요. 잘로 되는 휴대폰만 있으면 돼요.")],
        [T("Khách hủy thì sao?", "손님이 취소하면요?"), T("Uncle Day báo qua Zalo. Lịch bị hủy không tính phí.", "잘로로 알려 드려요. 취소 건은 비용이 없어요.")],
        [T("Khi nào trả hoa hồng?", "수수료는 언제 내요?"), T("Lúc đầu theo từng lượt khách. Khi lịch đặt nhiều, thỏa thuận chuyển sang cuối tháng.", "처음엔 건별로, 예약이 많아지면 협의해서 월말 정산으로 바꿔요.")],
        [T("Giá có khác giá cửa hàng?", "가격이 가게랑 달라요?"), T("Không. Dùng đúng giá của cửa hàng.", "아니요. 가게 가격 그대로예요.")],
        [T("Có hứa số lượng khách?", "손님 수를 약속해요?"), T("Không hứa con số. Uncle Day quảng bá để khách Hàn tìm thấy cửa hàng.", "숫자는 약속하지 않아요. 한국 손님이 가게를 찾도록 홍보해요.")]] },
    { dark: true, eb: T("BẮT ĐẦU", "시작하기"), h2: T("3 bước để đón khách quốc tế từ Uncle Day", "3단계면 엉클데이 손님을 받을 수 있어요"), c: 3,
      steps: [card(0, T("Cung cấp thông tin", "가게 정보 주기"), T("Tên cửa hàng, Google Maps, giờ mở cửa, ảnh menu và giá. Ảnh cửa hàng — chỉ khi anh/chị đồng ý.", "가게 이름 · 구글 지도 · 영업시간 · 메뉴판 사진. 가게 사진은 허락하실 때만.")),
        card(0, T("Ký hợp đồng", "계약서 서명"), T("Uncle Day gửi hợp đồng (PDF) qua Zalo hoặc email, ghi sẵn tên cửa hàng và tỷ lệ hoa hồng.", "가게 이름 · 수수료율이 들어간 계약서(PDF)를 잘로 · 메일로 보내 드려요.")),
        card(0, T("Nhận link và thẻ QR", "링크 · QR 받기"), T("Link đặt lịch riêng cho Google Maps, Facebook, Zalo — và thẻ QR menu nhiều ngôn ngữ để đặt ở quầy.", "구글 지도 · 페이스북 · 잘로용 가게 전용 예약 링크와 카운터에 둘 메뉴 QR 카드."))],
      lead: T("Để lại số Zalo — nhân viên Uncle Day sẽ liên hệ.", "잘로 번호를 남겨 주시면 연락드릴게요."), site: true }
  ];
  var L = function (x) { return x && typeof x === "object" && "vi" in x ? x[LANG] : x; };
  function slide(s) {
    var h = '';
    if (s.eb) h += '<p class="eb">' + esc(L(s.eb)) + '</p>';
    if (s.h1) h += '<h1>' + esc(L(s.h1)) + '</h1>';
    if (s.h2) h += '<h2>' + esc(L(s.h2)) + '</h2>';
    if (s.big) h += '<div><p class="big">' + s.big + '</p><p style="font-weight:800;margin-top:6px">' + esc(L(s.bigd)) + '</p></div>';
    if (s.mk) h += '<div class="mk">' + s.mk.map(function (m) { return '<div><span>' + m[0] + '</span><b>' + esc(L(m[1])) + '</b><em>' + esc(m[2]) + '</em></div>'; }).join("") + '</div>';
    if (s.sub) h += '<p style="font-weight:800;color:var(--ord)">' + esc(L(s.sub)) + '</p>';
    if (s.img) {
      h += '<div class="split"><div class="cards">' + s.checks.map(function (c) { return '<div class="card"><span class="n">✓</span><b style="font-weight:600">' + esc(L(c)) + '</b></div>'; }).join("") + '</div>'
        + '<div class="ph"><img src="images/intro/' + s.img + '.webp" alt="' + esc(L(s.alt)) + '" loading="lazy"></div></div>';
    }
    if (s.cards) h += '<div class="cards c' + (s.c || 1) + '">' + s.cards.map(function (c) { return '<div class="card' + (c.hi ? " hi" : "") + '"><span class="ic">' + c.ic + '</span><b>' + esc(L(c.t)) + '</b><small>' + esc(L(c.d)) + '</small></div>'; }).join("") + '</div>';
    if (s.steps) h += '<div class="cards c' + (s.c || 1) + '">' + s.steps.map(function (c, i) { var who = c.ic ? '<span class="who">' + esc(L(c.ic)) + '</span>' : ''; return '<div class="card"><span class="n">' + (i + 1) + '</span><b>' + who + esc(L(c.t)) + '</b>' + (c.d ? '<small>' + esc(L(c.d)) + '</small>' : '<small></small>') + '</div>'; }).join("") + '</div>';
    if (s.shots) h += '<div class="phs">' + s.shots.map(function (x) { return '<figure><div class="ph"><img src="images/intro/' + x[0] + '.webp" alt="' + esc(L(x[1])) + '" loading="lazy"></div><figcaption>' + esc(L(x[1])) + '</figcaption></figure>'; }).join("") + '</div>';
    if (s.faq) h += '<table>' + s.faq.map(function (r) { return '<tr><td>' + esc(L(r[0])) + '</td><td>' + esc(L(r[1])) + '</td></tr>'; }).join("") + '</table>';
    if (s.lead) h += '<p class="lead">' + esc(L(s.lead)) + '</p>';
    if (s.pill) h += '<p class="pill">' + esc(L(s.pill)) + '</p>';
    if (s.demo) h += '<p><a class="pill" style="text-decoration:none;background:var(--g);color:#fff" href="demo.html?role=owner&lang=' + LANG + '" target="_blank" rel="noopener">' + esc(L(s.demo)) + '</a></p>';
    if (s.site) h += '<p class="pill">www.uncleday.com</p>';
    if (s.src) h += '<p class="src">' + esc(L(s.src)) + '</p>';
    return '<section class="sl' + (s.dark ? " dark" : "") + '">' + h + '</section>';
  }
  var deck = document.getElementById("deck"), cur = 0;
  function render() {
    document.documentElement.lang = LANG; document.body.classList.toggle("ko", LANG === "ko");
    deck.innerHTML = S.map(slide).join("");
    document.querySelectorAll("[data-l]").forEach(function (b) { b.classList.toggle("on", b.dataset.l === LANG); });
    document.getElementById("dots").innerHTML = S.map(function (_, i) { return "<i></i>"; }).join("");
    go(cur, true);
  }
  function mark() {
    document.querySelectorAll("#dots i").forEach(function (d, i) { d.classList.toggle("on", i === cur); });
    document.getElementById("cnt").textContent = (cur + 1) + "/" + S.length;
    var p = document.getElementById("prev"), n = document.getElementById("next");
    p.textContent = UI.prev[LANG]; p.disabled = cur === 0;
    n.textContent = cur === S.length - 1 ? UI.done[LANG] : UI.next[LANG];
  }
  function go(i, instant) { cur = Math.max(0, Math.min(S.length - 1, i)); deck.scrollTo({ left: cur * deck.clientWidth, behavior: instant ? "auto" : "smooth" }); mark(); }
  var tm; deck.addEventListener("scroll", function () { clearTimeout(tm); tm = setTimeout(function () { var i = Math.round(deck.scrollLeft / deck.clientWidth); if (i !== cur) { cur = i; mark(); } }, 60); });
  window.addEventListener("resize", function () { go(cur, true); });
  document.getElementById("prev").onclick = function () { go(cur - 1); };
  document.getElementById("next").onclick = function () { go(cur === S.length - 1 ? 0 : cur + 1); };
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
  document.querySelectorAll("[data-l]").forEach(function (b) { b.onclick = function () { LANG = b.dataset.l; try { history.replaceState(null, "", "?lang=" + LANG); } catch (e) {} render(); }; });
  render();
})();
</script>
</body>
</html>
