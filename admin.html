<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>엉클데이 관리자</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--main:#116241;--main-d:#0c4a31;--bg:#FFF8E8;--card:#fff;--text:#0E2843;--sub:#5f6b78;--line:#EEE2CB;--warn:#e67e22;--warn-bg:#fff4e5;--ok:#2a9d8f;--ok-bg:#e6f6f3;--danger:#d64545;
  --font:"Poppins","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0001}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--text);letter-spacing:-.03em;text-decoration:none}
.logo small{color:var(--sub);font-weight:700;font-size:13px;margin-left:4px}
.grow{flex:1}
.save-state{font-size:13px;color:var(--sub)}
.save-state.dirty{color:var(--warn);font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c9ced4}
.btn.main{background:var(--main);border-color:var(--main);color:#fff}
.btn.main:hover{background:var(--main-d)}
.btn.main:disabled{background:#a9c4b5;border-color:#a9c4b5;cursor:default}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.notice{border-radius:12px;padding:12px 14px;margin:14px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warn-bg);color:#9a5208}
.notice.info{background:#eef6ff;color:#1d4f91}
.notice.err{background:#fdecec;color:#9b2c2c}
.notice .grow{min-width:200px}
.gate{max-width:440px;margin:80px auto;background:#fff;border-radius:16px;padding:28px;text-align:center}
.gate h1{font-size:20px;margin:0 0 8px}
.gate p{color:var(--sub);margin:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:#fff;border-radius:12px;padding:12px 14px}
.stat small{color:var(--sub);display:block;font-size:12px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.list{background:#fff;border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr 120px 96px 110px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:#fafbfc;color:var(--sub);font-size:12px;font-weight:700;padding-top:8px;padding-bottom:8px}
.thumb{width:52px;height:40px;border-radius:8px;background:#F4EAD8;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.nm b{display:block}
.nm small{color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.wait{background:var(--warn-bg);color:var(--warn)}
.geo-apx{font-size:11.5px;color:#9a5208}
.chk-prog{font-size:12px;color:var(--sub);font-weight:700}
.chk-prog.full{color:var(--ok)}
.badge.best{background:linear-gradient(90deg,#FD6A00,#FFB300);color:#fff;margin-left:6px}
.switch.best-sw{background:#FFF3E6;margin-bottom:8px}
.switch.best-sw.on{background:#FFE2C4}
.switch.best-sw input{accent-color:#FD6A00}
.badge.chk{background:#fdecec;color:#c0392b;margin-left:6px}
.review{background:#fff4e5;border:1px solid #f6c48b;border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.review h3{margin:0;font-size:15px;color:#9a5208}
.review ul{margin:0;padding-left:18px;color:#7a4a12}
.rv-list{list-style:none;margin:6px 0 0;padding:8px 10px;background:#fff4e5;border-radius:8px;display:grid;gap:3px}
.rv-list li{font-size:12.5px;color:#8a4b0f;line-height:1.45}
.rv-list li::before{content:"⚠ ";}
.stat.click{cursor:pointer}
.stat.click:hover{outline:2px solid #f6c48b}
.badge.new{background:#eef6ff;color:#1d4f91;margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--sub)}

/* 편집 창 */
.overlay{position:fixed;inset:0;background:#0006;z-index:50;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(940px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.panel-head{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px #0001;z-index:2}
.panel-head h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{padding:16px;display:grid;gap:14px}
.box{background:#fff;border-radius:14px;padding:16px;display:grid;gap:12px}
.box h3{margin:0;font-size:15px}
.box h3 small{color:var(--sub);font-weight:400;margin-left:6px}
.f{display:grid;gap:4px}
.f > span{font-size:12px;font-weight:700;color:#4b5563}
.f > span em{font-style:normal;color:var(--danger)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #11624155;border-color:var(--main)}
.hint{font-size:12px;color:var(--sub)}
.err-text{font-size:12px;color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:#fff}
.checks input{display:none}
.checks label:has(input:checked){background:var(--main);border-color:var(--main);color:#fff}
.switch{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--warn-bg);cursor:pointer}
.switch.on{background:var(--ok-bg)}
.switch input{width:18px;height:18px;accent-color:var(--ok)}
.img-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-prev{width:160px;height:100px;border-radius:10px;background:#F4EAD8;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.img-prev img{width:100%;height:100%;object-fit:cover}
.focus-wrap{display:grid;gap:10px}
.focus-src{position:relative;display:inline-block;max-width:100%;cursor:crosshair;border-radius:10px;overflow:hidden;line-height:0;justify-self:start}
.focus-src img{max-width:100%;max-height:300px;display:block}
.focus-dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;background:#FD6A00;box-shadow:0 0 0 2px #0005;pointer-events:none}
.focus-prevs{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.focus-prevs small{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
.fp{border-radius:10px;overflow:hidden;background:#F4EAD8}
.fp img{width:100%;height:100%;object-fit:cover;display:block}
.fp.card{width:180px;aspect-ratio:3/2}
.rv-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:#fff}
.rv-row{display:grid;grid-template-columns:110px 1fr 130px auto;gap:8px;align-items:center}
.rv-item select,.rv-item input,.rv-item textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.rv-item textarea{min-height:64px;resize:vertical}
@media (max-width:760px){.rv-row{grid-template-columns:1fr 1fr}}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mb-item{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;background:#fff}
.mb-item .mb-img{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#f1f3f5}
.mb-item .mb-img img{width:100%;height:100%;object-fit:contain;display:block}
.mb-item input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.mb-item .mb-btns{display:flex;gap:4px}
.mb-item .mb-btns .btn{flex:1;justify-content:center;padding:4px 6px}
.fp.hero{width:260px;aspect-ratio:16/9}
.menu-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.menu-item .three{grid-template-columns:1fr 1fr 1fr auto}
.menu-item .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three>*,.two>*,.tag-edit>*,.menu-item .three>*,.rv-row>*{min-width:0}
.tag-edit input,.menu-item input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tag-edit{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center}

/* CSV 미리보기 */
.modal{background:#fff;border-radius:16px;width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto;margin:auto;padding:20px}
.overlay.center{justify-content:center;align-items:center}
.modal h2{margin:0 0 6px;font-size:18px}
.modal ul{padding-left:18px;margin:6px 0}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;z-index:140;font-weight:700;max-width:calc(100% - 32px)}
code{background:#f1f3f5;border-radius:5px;padding:1px 5px;font-size:12px}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:52px 1fr auto;row-gap:4px}
  .row.head{display:none}
  .row .c-cat,.row .c-city{display:none}
  .row .c-st{grid-column:2;grid-row:2}
  .row .c-act{grid-column:3;grid-row:1/3}
  .two,.three{grid-template-columns:1fr}
  .menu-item .three{grid-template-columns:1fr}
}

/* ===== 탭 ===== */
.tabs{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tabs button.on{color:var(--main);border-color:var(--main)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;margin-left:4px;text-align:center}
.tabs .cnt:empty{display:none}
.me{font-size:12.5px;color:var(--sub)}
.badge.hid{background:#eceff3;color:#4b5563;margin-left:6px}
.rate-tag{font-size:12px;font-weight:700;color:var(--main)}
.rate-tag.none{color:var(--danger)}
.switch.pub-sw{background:#eceff3}.switch.pub-sw.on{background:var(--ok-bg)}
.box.contract{border:2px solid #d8e7df}
h2.sec{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.sec small{font-size:13px;color:var(--sub);font-weight:500}

/* ===== 대시보드 ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:16px}
.guide{max-width:880px;margin:6px 0 60px}
.guide-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}.guide-top input{flex:1;min-width:240px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font:inherit}
.guide-nav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.guide-nav a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:inherit;text-decoration:none}.guide-nav a:hover{border-color:#116241;color:#116241}
.guide-item{background:#fff;border-radius:12px;margin:8px 0;border:1px solid #0000}.guide-item[open]{border-color:var(--line)}
.gtable{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}.gtable th,.gtable td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}.gtable th{background:#f7f4ec}
.guide-item summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:center}.guide-item summary::-webkit-details-marker{display:none}
.guide-item summary::after{content:"＋";margin-left:auto;color:var(--sub)}.guide-item[open] summary::after{content:"－"}
.g-ic{font-size:18px}.g-who{font-style:normal;font-size:11.5px;font-weight:700;color:#A44500;background:#FFF0E3;padding:2px 8px;border-radius:999px}
.g-body{padding:0 18px 14px 46px;font-size:14px;line-height:1.7}.g-body ul,.g-body ol{padding-left:20px;margin:6px 0}.g-body p{margin:8px 0}
.g-body code{background:#f4efe3;padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
.g-body .tip{background:#EAF5EF;border-radius:9px;padding:9px 12px}.g-body .warn{background:#FFF0E3;color:#7a3500;border-radius:9px;padding:9px 12px}
@media(max-width:600px){.g-body{padding:0 14px 14px 16px}}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.dim-card{background:#fff;border-radius:14px;padding:16px 18px}.dim-card.wide{grid-column:1/-1}
.dim-card h3{margin:0 0 6px;font-size:15px}.dim-card h3 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
.dim-card .hint{margin:0 0 10px;font-size:12px}.dim-card .empty{color:var(--sub);font-size:13px;margin:10px 0 0}
.dim-row{display:grid;grid-template-columns:minmax(110px,46%) 1fr 74px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.dim-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim-bar{height:10px;background:#f1ece0;border-radius:6px;overflow:hidden}.dim-bar i{display:block;height:100%;background:#116241;border-radius:6px}
.dim-n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.dim-n small{color:var(--sub);font-weight:500;margin-left:5px;font-size:11.5px}
.day-chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}
.day-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;cursor:default}
.day-col i{display:block;width:100%;background:#116241;border-radius:4px 4px 0 0;opacity:.85}.day-col:hover i{opacity:1;background:#F07A1A}
.day-col small{font-size:10.5px;color:var(--sub);height:16px;line-height:16px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{outline:2px solid #11624133}
.kpi small{display:block;color:var(--sub);font-size:12.5px;font-weight:700}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi em{font-style:normal;font-size:12px;color:var(--sub)}
.kpi.alert b{color:var(--danger)}
.kpi.money b{color:var(--main)}
.todo{background:#fff;border-radius:14px;overflow:hidden}
.todo-row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.todo-row:first-child{border-top:0}
.todo-row:hover{background:#fbfaf6}
.todo-row .ic{font-size:18px;width:26px;text-align:center}
.todo-row b{flex:1}
.todo-row .n{font-weight:800;font-size:16px;min-width:28px;text-align:right}
.todo-row.zero{opacity:.45;cursor:default}
.todo-row.zero:hover{background:none}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:13.5px}
table.t th{background:#fafbfc;color:var(--sub);font-size:12px;text-align:left;padding:9px 12px;font-weight:700;white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#fbfaf6}
table.t tfoot td{font-weight:800;background:#fafbfc}
.tscroll{overflow-x:auto;border-radius:14px}
.month-pick{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}

/* ===== 예약 ===== */
.st{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.requested{background:#fff4e5;color:#b45f06}.st.shop_ok{background:#e6f6ec;color:#1f7a4d}.st.reschedule{background:#fff0d6;color:#9a5208}.st.confirmed{background:#e8f1ff;color:#1d4f91}
.st.visited{background:#e6f6f3;color:#1f7a6e}.st.settled{background:#116241;color:#fff}
.st.cancelled,.st.rejected,.st.noshow{background:#f1f3f5;color:#6b7280}
.marks{display:flex;gap:3px;font-size:13px}
.marks i{font-style:normal;opacity:.22;filter:grayscale(1)}
.marks i.on{opacity:1;filter:none}
.bk-code{font-family:Poppins,sans-serif;font-weight:700;white-space:nowrap}
.src{font-size:11px;color:var(--sub);font-weight:700}
.trace{display:grid;gap:6px}
.trace div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.trace .y{color:var(--ok);font-weight:800}.trace .n{color:#b9c0c8;font-weight:800}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.tl li:first-child{border-top:0}
.tl time{color:var(--sub);font-variant-numeric:tabular-nums}
.tl .who{font-weight:800}
.tl .who.shop{color:#b45f06}.tl .who.cust{color:#1d4f91}.tl .who.adm{color:var(--main)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn.st-btn{font-size:13px;padding:7px 12px}
.btn.st-btn.cur{background:var(--text);color:#fff;border-color:var(--text);cursor:default}
.calc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.calc .out{background:var(--ok-bg);border-radius:10px;padding:9px 12px;font-weight:800;color:var(--main);font-variant-numeric:tabular-nums}
.msg-prev{white-space:pre-wrap;background:#f7f9fb;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0;max-height:180px;overflow:auto}
.sl-pill{margin-left:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:#eee;color:#666;vertical-align:middle}.sl-pill.ok{background:#e3f4ea;color:#116241}
.sl-evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin:12px 0 4px}
.sl-ev{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;gap:7px}
.sl-ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer}.sl-ck input{margin-top:3px}.sl-ck span{display:grid}.sl-ck small{color:var(--sub);font-size:12px}
.sl-ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sl-ch .sl-pill{margin-left:0}
.sl-ch input{flex:1 1 100%;box-sizing:border-box;min-width:0;width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.linkish{background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.pill-filter{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}
.pill-filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.pill-filter button.on{background:var(--main);border-color:var(--main);color:#fff}

.re-doc h2:first-child,.re-doc h3:first-child{margin-top:2px}
.re-doc ul,.re-doc ol{margin:2px 0;padding-left:24px}
.re-doc ul.check{list-style:none;padding-left:4px}
.re-doc ul.check>li{position:relative;padding-left:26px;min-height:1.6em}
.re-doc ul.check>li::before{content:"";position:absolute;left:2px;top:.3em;width:15px;height:15px;border:1.6px solid #9ca3af;border-radius:4px;background:#fff;cursor:pointer}
.re-doc ul.check>li[data-done]{color:#9ca3af;text-decoration:line-through}
.re-doc ul.check>li[data-done]::before{background:var(--main);border-color:var(--main)}
.re-doc ul.check>li[data-done]::after{content:"✓";position:absolute;left:4.5px;top:.05em;color:#fff;font-size:12px;font-weight:900;pointer-events:none}
.re-doc .toggle{margin:3px 0}
.re-doc .tg-head{position:relative;padding-left:22px;font-weight:700;min-height:1.6em}
.re-doc .tg-head::before{content:"▶";position:absolute;left:2px;top:.15em;font-size:11px;color:#6b7280;cursor:pointer;transition:transform .15s}
.re-doc .toggle.open>.tg-head::before{transform:rotate(90deg)}
.re-doc .tg-body{padding-left:22px;display:none}
.re-doc .toggle.open>.tg-body{display:block}
.re-doc .callout{background:#fff7e0;border-radius:10px;padding:8px 12px 8px 36px;margin:6px 0;position:relative}
.re-doc .callout::before{content:"💡";position:absolute;left:10px;top:8px}
.re-doc blockquote{border-left:3px solid #d6cdb8;margin:6px 0;padding:2px 12px;color:#57534e}
.re-doc hr{border:0;border-top:1px solid #e5dcc8;margin:12px 0}
.re-doc a{color:#1d4f91}
.re-menu,.re-tplmenu{position:absolute;z-index:90;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002;padding:6px;width:230px;max-height:300px;overflow:auto}
.re-tplmenu{right:6px;top:40px;width:260px}
.re-mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;position:relative}
.re-mi.on,.re-mi:hover{background:#f3eee2}
.re-mi small{color:var(--sub);margin-left:auto;font-size:11.5px}
.re-ic{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#fff}
.re-tplh{font-size:11px;color:var(--sub);font-weight:800;padding:6px 8px 2px}
.re-mi.save b{color:var(--main)}
.re-del{border:0;background:none;color:#b42318;cursor:pointer;margin-left:6px}
.km.ckp{position:relative;height:16px;background:#eef2ef;border-radius:999px;overflow:hidden;font-size:11px}
.km.ckp span{position:absolute;inset:0 auto 0 0;background:#cfe6d9}
.km.ckp em{position:relative;font-style:normal;font-weight:800;padding-left:8px;color:#1f5f55}
.task-modal{max-height:calc(100vh - 32px);overflow-y:auto;overflow-x:hidden}
.task-modal .re-doc{min-height:min(46vh,420px);max-height:none}
.re-doc img{display:block;max-width:min(100%,720px);height:auto;border-radius:10px;margin:6px 0;cursor:zoom-out;border:1px solid #eee}
.re-doc img.sm{max-width:min(320px,100%);cursor:zoom-in}
.re-doc.drop{outline:2px dashed var(--main);outline-offset:-6px;background:#f3f8f5}
.re.re-big{position:fixed;inset:12px;z-index:120;display:flex;flex-direction:column;box-shadow:0 0 0 100vmax #0007}
.re.re-big .re-doc{flex:1;max-height:none;min-height:0;padding:24px max(24px,calc((100% - 860px)/2));font-size:15.5px}
.re-bar .re-full{font-weight:700}
.bell-wrap{position:relative}
.bell{border:1px solid var(--line);background:#fff;border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;position:relative}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-weight:800}
.bell .cnt:empty{display:none}
.noti{position:absolute;right:0;top:48px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px #0003;z-index:60;border:1px solid var(--line)}
.noti-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.noti-h b{flex:1}
.noti-h button{border:0;background:none;color:var(--main);font-weight:700;cursor:pointer;font-size:12.5px}
.ni{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #f3efe6;cursor:pointer}
.ni:hover{background:#fbfaf6}
.ni.unread{background:#f3f8f5}
.ni .ic{font-size:18px;line-height:1.2}
.ni .tx{flex:1;min-width:0;font-size:13.5px}
.ni .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .tx p{margin:2px 0 0;color:var(--sub);font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ni time{font-size:11.5px;color:var(--sub)}
.ni .dot{width:8px;height:8px;border-radius:50%;background:var(--main);margin-top:6px;flex:0 0 8px}
.ni:not(.unread) .dot{visibility:hidden}
.cmts{display:grid;gap:10px;background:#faf8f3;border-radius:12px;padding:12px}
.cmt-list{display:grid;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.av{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#dbe7f3;color:#1d4f91;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.av.me{background:#d5ebdf;color:var(--main)}
.cmt-b{flex:1;min-width:0}
.cmt-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.cmt-h time{color:var(--sub);font-size:12px}
.cmt-act{margin-left:auto;display:flex;gap:6px}
.cmt-act button{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:0}
.cmt-act button:hover{color:var(--text);text-decoration:underline}
.cmt-t{font-size:14px;line-height:1.55;overflow-wrap:anywhere;margin-top:2px}
.cmt-t textarea{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.adm-row{display:flex;align-items:center;gap:8px;margin:4px 0}.adm-row small{color:var(--sub)}
.nick-in{width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:700}
.nick-nudge{background:#fff7e8;border:1px solid #f3dcb0;border-radius:12px;padding:10px 14px;margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.at-wrap{position:relative;flex:1;min-width:0}.at-wrap textarea{width:100%;box-sizing:border-box}
.at-in{margin-top:8px;width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font:inherit}
.at-pop{position:absolute;left:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;z-index:60;min-width:240px;padding:4px;display:grid}
.at-pop button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 9px;border-radius:7px;text-align:left;cursor:pointer;font:inherit}
.at-pop button.on,.at-pop button:hover{background:#e9f2ec}.at-pop small{color:var(--sub);margin-left:auto;font-size:11.5px}
.at-pop .av{width:22px;height:22px;border-radius:50%;background:var(--main);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.mention-pick{border:0;background:#e8f1ff;color:#1d4f91;border-radius:6px;padding:1px 6px;font-weight:700;cursor:pointer;font-size:12px}
.mention{color:#1d4f91;background:#e8f1ff;border-radius:4px;padding:0 3px;font-weight:700}
.cmt-new{display:flex;gap:8px;align-items:flex-start}
.cmt-new textarea{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;resize:none;background:#fff}
@media (max-width:760px){.kanban.tasks{grid-template-columns:repeat(3,82vw)}.kanban.leads{grid-template-columns:repeat(7,78vw)}}
</style>

<body>
<header class="top"><div class="top-in">
  <a class="logo" href="./"><img src="images/logo-t.png" alt="Uncle Day" style="height:44px;width:auto;vertical-align:middle;margin-right:4px"><small>관리자</small></a>
  <span class="grow"></span>
  <span class="bell-wrap"><button class="bell" id="bell" hidden title="알림">🔔<span class="cnt" id="cntBell"></span></button><div class="noti" id="noti" hidden></div></span>
  <span class="me" id="me"></span>
  <a class="btn" href="./" target="_blank" rel="noopener">사이트 보기</a>
</div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="dash" class="on">📊 대시보드</button>
  <button data-tab="work">📝 낙서장<span class="cnt" id="cntWork"></span></button>
  <button data-tab="bk">📅 예약<span class="cnt" id="cntBk"></span></button>
  <button data-tab="chat">💬 채팅<span class="cnt" id="cntChat"></span></button>
  <button data-tab="crm">👥 고객</button>
  <button data-tab="settle">💰 정산</button>

  <button data-tab="rv">⭐ 후기<span class="cnt" id="cntRv"></span></button>
  <button data-tab="acc">⚙️ 계정</button>
</nav></header>

<div id="gate" class="login-card"><h1>불러오는 중…</h1></div>

<main class="wrap" id="app" hidden>
  <div id="notices"></div>

  <section id="tab-dash" data-pane="dash"></section>
  <section id="tab-work" data-pane="work" hidden></section>
  <section id="tab-bk" data-pane="bk" hidden></section>
  <section id="tab-chat" data-pane="chat" hidden></section>
  <section id="tab-crm" data-pane="crm" hidden></section>
  <section id="tab-settle" data-pane="settle" hidden></section>

  <section id="tab-shops" data-pane="shops" hidden>
    <div id="shopNotices"></div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="업체명, 아이디, 태그 검색">
      <select id="fCity"></select>
      <select id="fCat"></select>
      <select id="fSt">
        <option value="">상태 전체</option>
        <option value="wait">정보 확인 중</option>
        <option value="ok">입점 확인됨</option>
        <option value="review">⚠ 확인 필요</option>
        <option value="norate">수수료 미정</option>
        <option value="hidden">사이트에서 숨김</option>
      </select>
      <span class="hint" id="shopListCount"></span>
    </div>
    <div class="actions">
      <button class="btn main" id="addBtn">＋ 새 업체 등록</button>
      <button class="btn" id="catImgBtn">🖼 카테고리 사진</button>
      <button class="btn" id="ctTplBtn">📄 계약서 양식</button>
      <button class="btn" id="csvBtn">📤 엑셀(CSV) 일괄 업로드</button>
      <button class="btn" id="tplBtn">📄 업로드 양식 받기</button>
      <button class="btn" id="expBtn">⬇ 전체 목록 내보내기</button>
      <button class="btn" id="gpBulk" hidden>🔗 구글 지도 자동 연결</button>
      <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
    </div>
    <div class="list" id="list"></div>
    <p class="hint" style="margin:14px 0 40px">'저장'을 누르면 바로 데이터베이스에 저장되고 손님 화면에도 곧바로 반영돼요.</p>
  </section>

  <section id="tab-rv" data-pane="rv" hidden></section>
  <section id="tab-acc" data-pane="acc" hidden></section>
</main>
