<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>엉클데이 관리자</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--main:#116241;--main-d:#0c4a31;--bg:#FFF8E8;--card:#fff;--text:#0E2843;--sub:#5f6b78;--line:#EEE2CB;--warn:#e67e22;--warn-bg:#fff4e5;--ok:#2a9d8f;--ok-bg:#e6f6f3;--danger:#d64545;
  --font:"Poppins","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0001}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--text);letter-spacing:-.03em;text-decoration:none}
.logo small{color:var(--sub);font-weight:700;font-size:13px;margin-left:4px}
.grow{flex:1}
.save-state{font-size:13px;color:var(--sub)}
.save-state.dirty{color:var(--warn);font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c9ced4}
.btn.main{background:var(--main);border-color:var(--main);color:#fff}
.btn.main:hover{background:var(--main-d)}
.btn.main:disabled{background:#a9c4b5;border-color:#a9c4b5;cursor:default}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.notice{border-radius:12px;padding:12px 14px;margin:14px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warn-bg);color:#9a5208}
.notice.info{background:#eef6ff;color:#1d4f91}
.notice.err{background:#fdecec;color:#9b2c2c}
.notice .grow{min-width:200px}
.gate{max-width:440px;margin:80px auto;background:#fff;border-radius:16px;padding:28px;text-align:center}
.gate h1{font-size:20px;margin:0 0 8px}
.gate p{color:var(--sub);margin:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:#fff;border-radius:12px;padding:12px 14px}
.stat small{color:var(--sub);display:block;font-size:12px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.list{background:#fff;border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr 120px 96px 110px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:#fafbfc;color:var(--sub);font-size:12px;font-weight:700;padding-top:8px;padding-bottom:8px}
.thumb{width:52px;height:40px;border-radius:8px;background:#F4EAD8;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.nm b{display:block}
.nm small{color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.wait{background:var(--warn-bg);color:var(--warn)}
.geo-apx{font-size:11.5px;color:#9a5208}
.chk-prog{font-size:12px;color:var(--sub);font-weight:700}
.chk-prog.full{color:var(--ok)}
.badge.best{background:linear-gradient(90deg,#FD6A00,#FFB300);color:#fff;margin-left:6px}
.switch.best-sw{background:#FFF3E6;margin-bottom:8px}
.switch.best-sw.on{background:#FFE2C4}
.switch.best-sw input{accent-color:#FD6A00}
.badge.chk{background:#fdecec;color:#c0392b;margin-left:6px}
.review{background:#fff4e5;border:1px solid #f6c48b;border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.review h3{margin:0;font-size:15px;color:#9a5208}
.review ul{margin:0;padding-left:18px;color:#7a4a12}
.rv-list{list-style:none;margin:6px 0 0;padding:8px 10px;background:#fff4e5;border-radius:8px;display:grid;gap:3px}
.rv-list li{font-size:12.5px;color:#8a4b0f;line-height:1.45}
.rv-list li::before{content:"⚠ ";}
.stat.click{cursor:pointer}
.stat.click:hover{outline:2px solid #f6c48b}
.badge.new{background:#eef6ff;color:#1d4f91;margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--sub)}

/* 편집 창 */
.overlay{position:fixed;inset:0;background:#0006;z-index:50;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(940px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.panel-head{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px #0001;z-index:2}
.panel-head h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{padding:16px;display:grid;gap:14px}
.box{background:#fff;border-radius:14px;padding:16px;display:grid;gap:12px}
.box h3{margin:0;font-size:15px}
.box h3 small{color:var(--sub);font-weight:400;margin-left:6px}
.f{display:grid;gap:4px}
.f > span{font-size:12px;font-weight:700;color:#4b5563}
.f > span em{font-style:normal;color:var(--danger)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #11624155;border-color:var(--main)}
.hint{font-size:12px;color:var(--sub)}
.err-text{font-size:12px;color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:#fff}
.checks input{display:none}
.checks label:has(input:checked){background:var(--main);border-color:var(--main);color:#fff}
.switch{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--warn-bg);cursor:pointer}
.switch.on{background:var(--ok-bg)}
.switch input{width:18px;height:18px;accent-color:var(--ok)}
.img-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-prev{width:160px;height:100px;border-radius:10px;background:#F4EAD8;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.img-prev img{width:100%;height:100%;object-fit:cover}
.focus-wrap{display:grid;gap:10px}
.focus-src{position:relative;display:inline-block;max-width:100%;cursor:crosshair;border-radius:10px;overflow:hidden;line-height:0;justify-self:start}
.focus-src img{max-width:100%;max-height:300px;display:block}
.focus-dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;background:#FD6A00;box-shadow:0 0 0 2px #0005;pointer-events:none}
.focus-prevs{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.focus-prevs small{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
.fp{border-radius:10px;overflow:hidden;background:#F4EAD8}
.fp img{width:100%;height:100%;object-fit:cover;display:block}
.fp.card{width:180px;aspect-ratio:3/2}
.rv-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:#fff}
.rv-row{display:grid;grid-template-columns:110px 1fr 130px auto;gap:8px;align-items:center}
.rv-item select,.rv-item input,.rv-item textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.rv-item textarea{min-height:64px;resize:vertical}
@media (max-width:760px){.rv-row{grid-template-columns:1fr 1fr}}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mb-item{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;background:#fff}
.mb-item .mb-img{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#f1f3f5}
.mb-item .mb-img img{width:100%;height:100%;object-fit:contain;display:block}
.mb-item input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.mb-item .mb-btns{display:flex;gap:4px}
.mb-item .mb-btns .btn{flex:1;justify-content:center;padding:4px 6px}
.fp.hero{width:260px;aspect-ratio:16/9}
.menu-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.menu-item .three{grid-template-columns:1fr 1fr 1fr auto}
.menu-item .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three>*,.two>*,.tag-edit>*,.menu-item .three>*,.rv-row>*{min-width:0}
.tag-edit input,.menu-item input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tag-edit{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center}

/* CSV 미리보기 */
.modal{background:#fff;border-radius:16px;width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto;margin:auto;padding:20px}
.overlay.center{justify-content:center;align-items:center}
.modal h2{margin:0 0 6px;font-size:18px}
.modal ul{padding-left:18px;margin:6px 0}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-weight:700;max-width:calc(100% - 32px)}
code{background:#f1f3f5;border-radius:5px;padding:1px 5px;font-size:12px}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:52px 1fr auto;row-gap:4px}
  .row.head{display:none}
  .row .c-cat,.row .c-city{display:none}
  .row .c-st{grid-column:2;grid-row:2}
  .row .c-act{grid-column:3;grid-row:1/3}
  .two,.three{grid-template-columns:1fr}
  .menu-item .three{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="index.html" data-nav><img src="images/logo-full.webp" alt="Uncle Day" style="height:44px;width:auto;vertical-align:middle;margin-right:4px"><small>관리자</small></a>
  <span class="grow"></span>
  <span class="save-state" id="saveState"></span>
  <a class="btn" href="index.html" data-nav>사이트 보기</a>
  <button class="btn main" id="publishBtn" disabled>사이트에 반영</button>
  <button class="btn" id="logoutBtn" hidden>로그아웃</button>
</div></header>

<div id="gate" class="gate"><h1>불러오는 중…</h1><p>잠시만 기다려 주세요.</p></div>

<main class="wrap" id="app" hidden>
  <div id="notices"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="업체명, 아이디, 태그 검색">
    <select id="fCity"></select>
    <select id="fCat"></select>
    <select id="fSt">
      <option value="">상태 전체</option>
      <option value="wait">정보 확인 중</option>
      <option value="ok">입점 확인됨</option>
      <option value="review">⚠ 확인 필요</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn main" id="addBtn">＋ 새 업체 등록</button>
    <button class="btn" id="catImgBtn">🖼 카테고리 사진</button>
    <button class="btn" id="csvBtn">📤 엑셀(CSV) 일괄 업로드</button>
    <button class="btn" id="tplBtn">📄 업로드 양식 받기</button>
    <button class="btn" id="expBtn">⬇ 전체 목록 내보내기</button>
    <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  </div>
  <div class="list" id="list"></div>
  <p class="hint" style="margin:14px 0 40px">수정한 내용은 <b>사이트에 반영</b>을 누르면 GitHub에 저장되고, 1~2분 뒤 손님 화면에 나타나요. 반영 전 수정은 이 브라우저에 임시로 보관돼요.</p>
</main>

<div id="layer"></div>

<script src="data.js"></script>
<script src="shops.js"></script>
<script src="catimgs.js"></script>
<script src="admin-notes.js"></script>
<script>
/* ===== 상태 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const DAYS = ["일","월","화","수","목","금","토"];
const STAFF = [["ko","한국어"],["en","영어"],["vi","베트남어"],["ja","일본어"],["zh","중국어"]];
const DRAFT_KEY = "uncleday-admin-draft";
if (typeof ADMIN_NOTES !== "undefined") SHOPS.forEach(x => Object.assign(x, ADMIN_NOTES[x.id] || {}));
let BASE = JSON.stringify(SHOPS);

let shops = clone(SHOPS);
let catImgs = clone(typeof CAT_IMGS !== "undefined" ? CAT_IMGS : {});
let catChanged = false;
let pendingImgs = {};            // 새로 올린 사진: 경로 → Blob
const imgUrls = {};              // 미리보기용 주소
const changedIds = new Set();
let dirty = false, canSave = true, artifactNs = null, downloadsNs = null;

const catOf = id => CATEGORIES.find(c => c.id === id);
const cityOf = id => CITIES.find(c => c.id === id);
const catName = id => catOf(id) ? catOf(id).name.ko : id || "-";
const cityName = id => cityOf(id) ? cityOf(id).name.ko : id || "-";
const imgSrc = p => !p ? "" : (imgUrls[p] || p);
const isOk = s => s.verified !== false;
const needsReview = s => Array.isArray(s.review) && s.review.length > 0;
// 정보 확인 체크 항목 (마지막 '입점 동의'는 위의 '입점 확인 완료' 스위치와 같아요)
const CHK = [["address", "주소"], ["hours", "영업시간·휴무"], ["price", "가격"], ["langs", "응대 언어"]];
const chkCount = s => [CHK.filter(([k]) => (s.checks || {})[k]).length + (isOk(s) ? 1 : 0), CHK.length + 1];

function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function markDirty(id) {
  dirty = true; if (id) changedIds.add(id);
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: BASE, shops, changed: [...changedIds] })); } catch (e) {}
  drawState();
}
function drawState() {
  const n = changedIds.size + Object.keys(pendingImgs).length;
  $("saveState").textContent = dirty ? "반영 안 된 수정 " + [changedIds.size ? changedIds.size + "곳" : "", catChanged ? "카테고리 사진" : ""].filter(Boolean).join(" · ") : "모두 반영됨";
  $("saveState").className = "save-state" + (dirty ? " dirty" : "");
  $("publishBtn").disabled = !dirty || !canSave;
}
function notice(kind, html, id) {
  if (id && document.getElementById(id)) document.getElementById(id).remove();
  const d = document.createElement("div"); d.className = "notice " + kind; if (id) d.id = id;
  d.innerHTML = html; $("notices").appendChild(d); return d;
}

/* ===== 목록 ===== */
function fillFilters() {
  $("fCity").innerHTML = `<option value="">지역 전체</option>` + CITIES.map(c => `<option value="${c.id}">${esc(c.name.ko)}</option>`).join("");
  $("fCat").innerHTML = `<option value="">카테고리 전체</option>` + CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${esc(c.name.ko)}</option>`).join("");
  ["q","fCity","fCat","fSt"].forEach(k => $(k).oninput = drawList);
}
function drawStats() {
  const ok = shops.filter(isOk).length;
  const cities = new Set(shops.map(s => s.city)).size;
  $("stats").innerHTML = [
    ["전체 업체", shops.length], ["입점 확인됨", ok], ["정보 확인 중", shops.length - ok], ["⚠ 확인 필요", shops.filter(needsReview).length]
  ].map(([k, v], i) => `<div class="stat ${i === 3 ? "click" : ""}" ${i === 3 ? 'id="statReview" title="눌러서 확인 필요 업체만 보기"' : ""}><small>${k}</small><b>${v}</b></div>`).join("");
  if ($("statReview")) $("statReview").onclick = () => { $("fSt").value = "review"; drawList(); };
}
function drawList() {
  drawStats();
  const q = $("q").value.trim().toLowerCase(), city = $("fCity").value, cat = $("fCat").value, st = $("fSt").value;
  const list = shops.filter(s =>
    (!city || s.city === city) && (!cat || s.cat === cat) &&
    (!st || (st === "review" ? needsReview(s) : (st === "ok") === isOk(s))) &&
    (!q || (s.id + JSON.stringify(s.name) + JSON.stringify(s.tags)).toLowerCase().includes(q)));
  const head = `<div class="row head"><span></span><span>업체</span><span class="c-cat">카테고리</span><span class="c-city">지역</span><span class="c-st">상태</span><span></span></div>`;
  if (!list.length) { $("list").innerHTML = head + `<div class="empty">조건에 맞는 업체가 없어요.</div>`; return; }
  $("list").innerHTML = head + list.map(s => {
    const c = catOf(s.cat);
    return `<div class="row">
      <div class="thumb">${s.img ? `<img src="${esc(imgSrc(s.img))}" alt="" style="object-position:${s.imgPos || "50% 50%"}">` : (c ? c.icon : "✨")}</div>
      <div class="nm"><b>${esc(s.name.ko || s.name.en || "(이름 없음)")}${s.best ? `<span class="badge best">✦ 엉클 인증</span>` : ""}${needsReview(s) ? `<span class="badge chk">⚠ 확인 필요</span>` : ""}${changedIds.has(s.id) ? `<span class="badge new">수정됨</span>` : ""}</b><small>${esc(s.name.en || "")} · ${esc(s.id)}</small>${needsReview(s) ? `<ul class="rv-list">${s.review.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}</div>
      <span class="c-cat">${c ? c.icon + " " : ""}${esc(catName(s.cat))}</span>
      <span class="c-city">${esc(cityName(s.city))}</span>
      <span class="c-st">${isOk(s) ? `<span class="badge ok">입점 확인됨</span>` : `<span class="badge wait">정보 확인 중</span>`}${s.geo && s.geoApprox ? `<br><small class="geo-apx">📍 대략 위치</small>` : !s.geo ? `<br><small class="geo-apx">📍 좌표 없음</small>` : ""}<br><small class="chk-prog ${chkCount(s)[0] === chkCount(s)[1] ? "full" : ""}">확인 ${chkCount(s)[0]}/${chkCount(s)[1]}</small></span>
      <span class="c-act"><button class="btn sm" data-edit="${esc(s.id)}">수정</button></span>
    </div>`;
  }).join("");
  $("list").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditor(b.dataset.edit));
}

/* ===== 편집 창 ===== */
const blankShop = () => ({
  id: "", cat: CATEGORIES[0].id, city: CITIES[0].id, verified: false,
  name: { ko: "", en: "", vi: "" }, rating: 0, reviews: 0, img: "",
  tags: [], desc: { ko: "", en: "" }, recommend: { ko: "", en: "" },
  address: { ko: "", en: "" }, map: "", open: "", close: "", closed: [], staffLangs: [], menu: []
});
const slug = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/đ/g, "d").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);

function openEditor(id) {
  const isNew = !id;
  const orig = isNew ? null : shops.find(s => s.id === id);
  const s = isNew ? blankShop() : clone(orig);
  ["name","desc","recommend","address"].forEach(k => s[k] = s[k] || { ko: "", en: "", vi: "" });
  s.tags = s.tags || []; s.menu = s.menu || []; s.closed = s.closed || []; s.staffLangs = s.staffLangs || [];
  let idTouched = !isNew;

  const LN = [["ko", "한국어"], ["en", "영어"], ["vi", "베트남어"]];
  const pair = (key, label, area, req) => `<div class="three">${LN.map(([l, n], j) => `
    <label class="f"><span>${label} (${n})${req && !j ? " <em>*</em>" : ""}</span>${area
      ? `<textarea data-k="${key}.${l}">${esc(s[key][l] || "")}</textarea>` : `<input data-k="${key}.${l}" value="${esc(s[key][l] || "")}">`}</label>`).join("")}</div>`;

  $("layer").innerHTML = `<div class="overlay" id="ov"><div class="panel" role="dialog" aria-label="업체 편집">
    <div class="panel-head"><h2 id="pTitle"></h2>
      <button class="btn" id="pCancel">닫기</button><button class="btn main" id="pOk">적용</button></div>
    <div class="panel-body">
      ${needsReview(s) ? `<div class="review" id="revBox"><h3>⚠ 확인이 필요해요</h3>
        <ul>${s.review.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        <div><button class="btn sm" id="revDone" type="button">확인 끝 · 배너 지우기</button> <span class="hint">누른 뒤 '적용'과 '사이트에 반영'까지 해야 저장돼요.</span></div></div>` : ""}
      <div class="box">
        <label class="switch best-sw ${s.best ? "on" : ""}" id="bSw"><input type="checkbox" id="bChk" ${s.best ? "checked" : ""}>
          <div><b>✦ 엉클 인증업체 배지 달기</b><div class="hint">켜면 손님 화면의 업체 사진과 이름 옆에 반짝이는 '엉클 인증업체' 배지가 붙고, 목록에서 맨 앞에 보여요.</div></div></label>
        <label class="switch ${isOk(s) ? "on" : ""}" id="vSw"><input type="checkbox" id="vChk" ${isOk(s) ? "checked" : ""}>
          <div><b>입점 확인 완료</b><div class="hint">켜면 손님 화면에서 "정보 확인 중" 표시가 사라지고, 영업시간과 메뉴가 있으면 예약 폼이 열려요.</div></div></label>
        <div class="f"><span>정보 확인 체크 <small style="font-weight:400;color:var(--sub)">업체에 직접 확인한 항목에 체크해요. 손님에게는 안 보여요.</small></span>
          <div class="checks" id="chkList">${CHK.map(([k, n]) => `<label><input type="checkbox" data-chk="${k}" ${(s.checks || {})[k] ? "checked" : ""}>${n}</label>`).join("")}</div>
          <div class="hint" id="chkSum"></div></div>
      </div>

      <div class="box"><h3>기본 정보</h3>
        ${pair("name", "업체명", false, true)}
        <div class="three">
          <label class="f"><span>카테고리 <em>*</em></span><select data-k="cat">${CATEGORIES.map(c => `<option value="${c.id}" ${c.id === s.cat ? "selected" : ""}>${c.icon} ${esc(c.name.ko)}</option>`).join("")}</select></label>
          <label class="f"><span>지역 <em>*</em></span><select data-k="city">${CITIES.map(c => `<option value="${c.id}" ${c.id === s.city ? "selected" : ""}>${esc(c.name.ko)}</option>`).join("")}</select></label>
          <label class="f"><span>아이디 (주소용) <em>*</em></span><input id="idIn" value="${esc(s.id)}" placeholder="예: dahan-spa"></label>
        </div>
        <div class="hint">아이디는 영어 소문자·숫자·- 만 써요. 업체 상세 주소에 쓰여서, 한 번 정하면 되도록 바꾸지 마세요.</div>
        <div class="err-text" id="idErr"></div>
      </div>

      <div class="box"><h3>대표 사진<small>가로 사진이 가장 잘 어울려요</small></h3>
        <div class="img-box">
          <div class="img-prev" id="imgPrev"></div>
          <div style="display:grid;gap:8px">
            <label class="btn" style="justify-content:center">📷 사진 올리기<input type="file" id="imgIn" accept="image/*" hidden></label>
            <button class="btn sm danger" id="imgDel" type="button">사진 빼기</button>
          </div>
        </div>
        <div class="focus-wrap" id="focusWrap" hidden>
          <div class="hint"><b>사진에서 꼭 보여야 하는 곳</b>(간판, 얼굴 등)을 눌러 주세요. 그곳을 중심으로 잘려요.</div>
          <div class="focus-src" id="focusSrc"><img id="focusImg" alt=""><i class="focus-dot" id="focusDot"></i></div>
          <div class="focus-prevs">
            <div><small>목록 카드에서는</small><div class="fp card"><img id="fpCard" alt=""></div></div>
            <div><small>상세 화면에서는</small><div class="fp hero"><img id="fpHero" alt=""></div></div>
            <button class="btn sm" id="focusReset" type="button">가운데로 되돌리기</button>
          </div>
        </div>
        <label class="f"><span>또는 사진 주소 직접 입력</span><input data-k="img" id="imgPath" value="${esc(s.img)}" placeholder="https://… 또는 images/파일명.jpg"></label>
      </div>

      <div class="box"><h3>소개</h3>
        ${pair("desc", "소개글", true)}
        ${pair("recommend", "이런 분께 추천", false)}
        <div><span class="f"><span>태그</span></span><div id="tagList" style="display:grid;gap:8px;margin-top:4px"></div>
          <button class="btn sm" id="tagAdd" type="button" style="margin-top:8px">＋ 태그 추가</button></div>
      </div>

      <div class="box"><h3>위치·영업</h3>
        ${pair("address", "주소", false)}
        <label class="f"><span>지도 링크 (구글맵 공유 주소)</span><input data-k="map" value="${esc(s.map)}" placeholder="https://maps.app.goo.gl/…"></label>
        <div class="f"><span>지도 좌표 (위도, 경도) <small style="font-weight:400;color:var(--sub)">'가까운 순' 정렬에 써요</small></span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input id="geoIn" style="flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line);border-radius:9px" placeholder="예: 16.06812, 108.22441" value="${s.geo ? s.geo.join(", ") : ""}">
            <a class="btn sm" id="geoView" target="_blank" ${s.geo ? `href="https://www.google.com/maps?q=${s.geo.join(",")}"` : "hidden"}>지도에서 확인</a>
            <span class="badge wait" id="geoApx" ${s.geo && s.geoApprox ? "" : "hidden"}>📍 대략 위치</span>
          </div>
          <div class="hint">구글 지도에서 업체 건물을 <b>마우스 오른쪽 클릭</b>(휴대폰은 길게 누르기)하면 맨 위에 숫자 두 개가 나와요. 그걸 복사해서 붙여 넣으면 정확한 위치가 돼요.</div>
          <div class="err-text" id="geoErr"></div></div>
        <div class="two">
          <label class="f"><span>여는 시간</span><input type="time" data-k="open" value="${esc(s.open)}"></label>
          <label class="f"><span>닫는 시간</span><input type="time" data-k="close" value="${esc(s.close)}"></label>
        </div>
        <div class="f"><span>쉬는 요일</span><div class="checks">${DAYS.map((d, i) => `<label><input type="checkbox" data-day="${i}" ${s.closed.includes(i) ? "checked" : ""}>${d}</label>`).join("")}</div></div>
        <div class="f"><span>응대 가능 언어</span><div class="checks">${STAFF.map(([k, v]) => `<label><input type="checkbox" data-lang="${k}" ${s.staffLangs.includes(k) ? "checked" : ""}>${v}</label>`).join("")}</div></div>
        <div class="two">
          <label class="f"><span>평점 (0~5, 없으면 0)</span><input type="number" step="0.1" min="0" max="5" data-k="rating" value="${s.rating || 0}"></label>
          <label class="f"><span>후기 수</span><input type="number" min="0" data-k="reviews" value="${s.reviews || 0}"></label>
        </div>
      </div>

      <div class="box"><h3>메뉴·가격<small>가격은 베트남 동(₫), 숫자만. 0이면 "상담 후 안내"</small></h3>
        <div id="menuList" style="display:grid;gap:10px"></div>
        <button class="btn sm" id="menuAdd" type="button">＋ 메뉴 추가</button>
      </div>

      <div class="box"><h3>가격표 사진<small>업체에서 받은 코스별 가격표를 올려요. 여러 장 한 번에 올릴 수 있어요</small></h3>
        <div class="mb-grid" id="mbList"></div>
        <div><label class="btn" style="display:inline-flex">📄 가격표 사진 올리기<input type="file" id="mbIn" accept="image/*" multiple hidden></label></div>
        <div class="hint">글씨가 잘 보이도록 크게 저장해요. 손님은 상세 화면에서 눌러서 크게 볼 수 있어요. 사진마다 이름(예: 마사지 코스, 패키지)을 달아 두면 찾기 쉬워요.</div>
      </div>

      <div class="box"><h3>이용후기<small>손님이 보낸 후기를 확인하고 붙여 넣어요</small></h3>
        <div id="rvList" style="display:grid;gap:10px"></div>
        <button class="btn sm" id="rvAdd" type="button">＋ 후기 추가</button>
        <div class="hint">손님 화면의 '후기 남기기'로 들어온 후기(카카오톡·이메일)를 확인한 뒤 여기에 넣으면 상세 화면과 메인 화면에 게시돼요. 후기가 있으면 위의 평점·후기 수는 자동으로 계산돼요. 직접 지어낸 후기는 넣지 마세요.</div>
      </div>

      ${isNew ? "" : `<div class="box"><h3>기타</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" id="dupBtn" type="button">이 업체 복제</button>
          <button class="btn sm danger" id="delBtn" type="button">업체 삭제</button></div></div>`}
    </div></div></div>`;

  const title = () => $("pTitle").textContent = (isNew ? "새 업체 · " : "") + (s.name.ko || s.name.en || "이름 없음");
  title();

  // 일반 칸
  $("layer").querySelectorAll("[data-k]").forEach(el => el.oninput = () => {
    const [a, b] = el.dataset.k.split(".");
    let v = el.value;
    if (a === "rating" || a === "reviews") v = +v || 0;
    if (b) s[a][b] = v; else s[a] = v;
    if (a === "name") {
      title();
      if (!idTouched && (s.name.en || s.name.ko)) { $("idIn").value = slug(s.name.en) || ""; }
    }
    if (a === "img") drawImg();
  });
  $("idIn").oninput = () => { idTouched = true; };
  $("geoIn").oninput = () => {
    const v = $("geoIn").value.trim();
    const m = v.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
    if (!v) { delete s.geo; delete s.geoApprox; $("geoErr").textContent = ""; }
    else if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) {
      s.geo = [+(+m[1]).toFixed(6), +(+m[2]).toFixed(6)]; delete s.geoApprox; $("geoErr").textContent = "";
    } else { $("geoErr").textContent = "숫자 두 개를 쉼표로 적어 주세요. 예: 16.06812, 108.22441"; return; }
    $("geoApx").hidden = !(s.geo && s.geoApprox);
    $("geoView").hidden = !s.geo; if (s.geo) $("geoView").href = `https://www.google.com/maps?q=${s.geo.join(",")}`;
  };
  if ($("revDone")) $("revDone").onclick = () => { delete s.review; $("revBox").remove(); toast("배너를 지웠어요. '적용'을 눌러 주세요."); };
  const drawChk = () => { const [n, t] = chkCount(s); $("chkSum").textContent = `확인 ${n} / ${t}` + (n === t ? " · 모두 확인됐어요" : ""); };
  $("bChk").onchange = () => { if ($("bChk").checked) s.best = true; else delete s.best; $("bSw").classList.toggle("on", !!s.best); };
  $("vChk").onchange = () => { s.verified = $("vChk").checked; $("vSw").classList.toggle("on", s.verified); drawChk(); };
  $("chkList").querySelectorAll("[data-chk]").forEach(el => el.onchange = () => {
    s.checks = s.checks || {}; s.checks[el.dataset.chk] = el.checked; drawChk(); });
  drawChk();
  $("layer").querySelectorAll("[data-day]").forEach(el => el.onchange = () => {
    s.closed = [...$("layer").querySelectorAll("[data-day]:checked")].map(x => +x.dataset.day);
  });
  $("layer").querySelectorAll("[data-lang]").forEach(el => el.onchange = () => {
    s.staffLangs = [...$("layer").querySelectorAll("[data-lang]:checked")].map(x => x.dataset.lang);
  });

  // 사진
  function drawImg() {
    const c = catOf(s.cat);
    const pos = s.imgPos || "50% 50%";
    $("imgPrev").innerHTML = s.img ? `<img src="${esc(imgSrc(s.img))}" alt="" style="object-position:${pos}">` : (c ? c.icon : "✨");
    $("focusWrap").hidden = !s.img;
    if (!s.img) return;
    const src = imgSrc(s.img);
    if ($("focusImg").getAttribute("src") !== src) { $("focusImg").src = src; $("fpCard").src = src; $("fpHero").src = src; }
    $("fpCard").style.objectPosition = pos; $("fpHero").style.objectPosition = pos;
    const [x, y] = pos.split(" ");
    $("focusDot").style.left = x; $("focusDot").style.top = y;
  }
  $("focusSrc").onclick = e => {
    const r = $("focusImg").getBoundingClientRect();
    const x = Math.round(Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)));
    const y = Math.round(Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)));
    s.imgPos = `${x}% ${y}%`; drawImg();
  };
  $("focusReset").onclick = () => { delete s.imgPos; drawImg(); };
  drawImg();
  $("imgIn").onchange = async () => {
    const file = $("imgIn").files[0]; if (!file) return;
    try {
      const blob = await shrink(file);
      const base = slug($("idIn").value) || "shop";
      const path = `images/${base}-${Date.now().toString(36)}.jpg`;
      pendingImgs[path] = blob; imgUrls[path] = URL.createObjectURL(blob);
      s.img = path; delete s.imgPos; $("imgPath").value = path; drawImg();
      toast(`사진 준비 완료 (${Math.round(blob.size / 1024)}KB)`);
    } catch (e) { toast("사진을 읽지 못했어요. 다른 파일로 해 주세요."); }
    $("imgIn").value = "";
  };
  $("imgDel").onclick = () => { s.img = ""; delete s.imgPos; $("imgPath").value = ""; drawImg(); };

  // 태그
  function drawTags() {
    $("tagList").innerHTML = s.tags.map((t, i) => `<div class="tag-edit">
      <input placeholder="한국어 (예: 한국어 매니저)" data-t="${i}.ko" value="${esc(t.ko)}">
      <input placeholder="영어 (예: Korean-speaking)" data-t="${i}.en" value="${esc(t.en)}">
      <input placeholder="베트남어 (예: Nói tiếng Hàn)" data-t="${i}.vi" value="${esc(t.vi || "")}">
      <button class="btn sm danger" data-tdel="${i}" type="button">삭제</button></div>`).join("") || `<span class="hint">태그가 없어요.</span>`;
    $("tagList").querySelectorAll("[data-t]").forEach(el => el.oninput = () => {
      const [i, l] = el.dataset.t.split("."); s.tags[i][l] = el.value; });
    $("tagList").querySelectorAll("[data-tdel]").forEach(el => el.onclick = () => { s.tags.splice(+el.dataset.tdel, 1); drawTags(); });
  }
  drawTags();
  $("tagAdd").onclick = () => { s.tags.push({ ko: "", en: "", vi: "" }); drawTags(); };

  // 메뉴
  function drawMenu() {
    $("menuList").innerHTML = s.menu.map((m, i) => `<div class="menu-item">
      <div class="three"><input placeholder="메뉴명 (한국어)" data-m="${i}.ko" value="${esc(m.name.ko)}">
        <input placeholder="메뉴명 (영어)" data-m="${i}.en" value="${esc(m.name.en)}">
        <input placeholder="메뉴명 (베트남어)" data-m="${i}.vi" value="${esc(m.name.vi || "")}">
        <button class="btn sm danger" data-mdel="${i}" type="button">삭제</button></div>
      <div class="nums"><label class="f"><span>소요 시간 (분)</span><input type="number" min="0" step="5" data-m="${i}.min" value="${m.min || 0}"></label>
        <label class="f"><span>가격 (₫)</span><input type="number" min="0" step="1000" data-m="${i}.price" value="${m.price || 0}"></label></div>
    </div>`).join("") || `<span class="hint">메뉴가 없어요. 메뉴가 없으면 손님 화면에 예약 폼 대신 상담 버튼이 나와요.</span>`;
    $("menuList").querySelectorAll("[data-m]").forEach(el => el.oninput = () => {
      const [i, k] = el.dataset.m.split(".");
      if (k === "ko" || k === "en" || k === "vi") s.menu[i].name[k] = el.value; else s.menu[i][k] = +el.value || 0;
    });
    $("menuList").querySelectorAll("[data-mdel]").forEach(el => el.onclick = () => { s.menu.splice(+el.dataset.mdel, 1); drawMenu(); });
  }
  drawMenu();
  $("menuAdd").onclick = () => { s.menu.push({ name: { ko: "", en: "", vi: "" }, min: 60, price: 0 }); drawMenu(); };

  // 이용후기
  s.userReviews = s.userReviews || [];
  function drawRevs() {
    $("rvList").innerHTML = s.userReviews.map((r, i) => `<div class="rv-item">
      <div class="rv-row">
        <select data-rv="${i}.stars">${[5, 4, 3, 2, 1].map(n => `<option value="${n}" ${n === r.stars ? "selected" : ""}>${"★".repeat(n)}</option>`).join("")}</select>
        <input data-rv="${i}.name" placeholder="이름(닉네임)" value="${esc(r.name || "")}">
        <input type="month" data-rv="${i}.date" value="${esc(r.date || "")}">
        <button class="btn sm danger" data-rvd="${i}" type="button">삭제</button>
      </div>
      <input data-rv="${i}.menu" placeholder="이용한 메뉴 (선택)" value="${esc(r.menu || "")}">
      <textarea data-rv="${i}.text" placeholder="후기 내용">${esc(r.text || "")}</textarea>
    </div>`).join("") || `<span class="hint">아직 게시된 후기가 없어요.</span>`;
    $("rvList").querySelectorAll("[data-rv]").forEach(el => el.oninput = () => {
      const [i, k] = el.dataset.rv.split("."); s.userReviews[i][k] = k === "stars" ? +el.value : el.value; });
    $("rvList").querySelectorAll("[data-rvd]").forEach(el => el.onclick = () => { s.userReviews.splice(+el.dataset.rvd, 1); drawRevs(); });
  }
  drawRevs();
  $("rvAdd").onclick = () => { s.userReviews.unshift({ stars: 5, name: "", date: new Date().toISOString().slice(0, 7), menu: "", text: "" }); drawRevs(); };

  // 가격표 사진
  s.menuImgs = s.menuImgs || [];
  function drawBoards() {
    $("mbList").innerHTML = s.menuImgs.map((m, i) => `<div class="mb-item">
      <div class="mb-img"><img src="${esc(imgSrc(m.src))}" alt=""></div>
      <input placeholder="이름 (예: 마사지 코스)" data-mb="${i}" value="${esc(m.cap || "")}">
      <div class="mb-btns">
        <button class="btn sm" data-mbl="${i}" type="button" ${i === 0 ? "disabled" : ""}>◀</button>
        <button class="btn sm" data-mbr="${i}" type="button" ${i === s.menuImgs.length - 1 ? "disabled" : ""}>▶</button>
        <button class="btn sm danger" data-mbd="${i}" type="button">삭제</button></div>
    </div>`).join("") || `<span class="hint">아직 가격표 사진이 없어요.</span>`;
    $("mbList").querySelectorAll("[data-mb]").forEach(el => el.oninput = () => { s.menuImgs[+el.dataset.mb].cap = el.value; });
    const mv = (i, d) => { const a = s.menuImgs; [a[i], a[i + d]] = [a[i + d], a[i]]; drawBoards(); };
    $("mbList").querySelectorAll("[data-mbl]").forEach(el => el.onclick = () => mv(+el.dataset.mbl, -1));
    $("mbList").querySelectorAll("[data-mbr]").forEach(el => el.onclick = () => mv(+el.dataset.mbr, 1));

// 사진 줄이기: 긴 변 1400px, JPEG
function shrink(file, max = 1400, q = 0.82) {
  return new Promise((ok, fail) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : fail(), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); fail(); };
    img.src = u;
  });
}

const COLS = [
  ["id", "아이디"], ["cat", "카테고리"], ["city", "지역"], ["name.ko", "업체명(한국어)"], ["name.en", "업체명(영어)"], ["name.vi", "업체명(베트남어)"],
  ["verified", "입점확인(Y/N)"], ["tags.ko", "태그(한국어)"], ["tags.en", "태그(영어)"], ["tags.vi", "태그(베트남어)"],
  ["desc.ko", "소개(한국어)"], ["desc.en", "소개(영어)"], ["desc.vi", "소개(베트남어)"], ["recommend.ko", "추천대상(한국어)"], ["recommend.en", "추천대상(영어)"], ["recommend.vi", "추천대상(베트남어)"],
  ["address.ko", "주소(한국어)"], ["address.en", "주소(영어)"], ["address.vi", "주소(베트남어)"], ["map", "지도링크"], ["geo", "좌표(위도,경도)"],
  ["open", "여는시간"], ["close", "닫는시간"], ["closed", "휴무요일"], ["staffLangs", "응대언어"],
  ["rating", "평점"], ["reviews", "후기수"], ["menu", "메뉴"], ["img", "사진주소"]
];
const csvCell = v => { v = String(v ?? ""); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
function toRow(s) {
  const langName = Object.fromEntries(STAFF);
  return COLS.map(([k]) => {
    switch (k) {
      case "cat": return catName(s.cat);
      case "city": return cityName(s.city);
      case "verified": return isOk(s) ? "Y" : "N";
      case "tags.ko": return (s.tags || []).map(t => t.ko).join(", ");
      case "tags.en": return (s.tags || []).map(t => t.en).join(", ");
      case "tags.vi": return (s.tags || []).map(t => t.vi || "").join(", ");
      case "geo": return s.geo ? s.geo.join(", ") : "";
      case "closed": return (s.closed || []).map(d => DAYS[d]).join(",");
      case "staffLangs": return (s.staffLangs || []).map(l => langName[l] || l).join(",");
      case "menu": return (s.menu || []).map(m => [m.name.ko, m.name.en, m.name.vi || "", m.min, m.price].join(" | ")).join(" ; ");
      default: { const [a, b] = k.split("."); return b ? (s[a] || {})[b] : s[a]; }
    }
  }).map(csvCell).join(",");
}
const csvText = rows => "﻿" + COLS.map(c => c[1]).join(",") + "\r\n" + rows.join("\r\n") + "\r\n";

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function decode(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder("euc-kr").decode(buf); }   // 엑셀 기본 CSV(한글 깨짐 방지)
}
const findCat = v => { v = v.trim(); return (CATEGORIES.find(c => c.id === v || c.name.ko === v || c.name.en.toLowerCase() === v.toLowerCase()) || {}).id; };
const findCity = v => { v = v.trim(); return (CITIES.find(c => c.id === v || c.name.ko === v || c.name.en.toLowerCase() === v.toLowerCase()) || {}).id; };
const split = (v, re = /[,，]/) => String(v || "").split(re).map(x => x.trim()).filter(Boolean);

function rowToShop(obj, line, errs) {
  const s = blankShop();
  const g = k => (obj[k] ?? "").trim();
  s.name = { ko: g("name.ko"), en: g("name.en") };
  if (!s.name.ko && !s.name.en) { errs.push(`${line}번째 줄: 업체명이 없어서 건너뛰었어요.`); return null; }
  if (!s.name.ko) s.name.ko = s.name.en; if (!s.name.en) s.name.en = s.name.ko;
  s.id = slug(g("id")) || slug(s.name.en) || "shop-" + Date.now().toString(36) + line;
  s.cat = findCat(g("cat")); s.city = findCity(g("city"));
  if (!s.cat) { errs.push(`${line}번째 줄 (${s.name.ko}): 카테고리 "${g("cat")}"를 못 찾았어요.`); return null; }
  if (!s.city) { errs.push(`${line}번째 줄 (${s.name.ko}): 지역 "${g("city")}"를 못 찾았어요.`); return null; }
  s.verified = /^(y|yes|o|확인|true|1)$/i.test(g("verified"));
  const tk = split(g("tags.ko")), te = split(g("tags.en")), tv = split(g("tags.vi"));
  s.tags = Array.from({ length: Math.max(tk.length, te.length) }, (_, i) => ({ ko: tk[i] || te[i] || "", en: te[i] || tk[i] || "", vi: tv[i] || "" }));
  ["desc", "recommend", "address"].forEach(k => s[k] = { ko: g(k + ".ko"), en: g(k + ".en"), vi: g(k + ".vi") });
  s.name.vi = g("name.vi");
  s.map = g("map"); s.img = g("img");
  { const m = g("geo").match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/); if (m) s.geo = [+m[1], +m[2]]; }
  const tm = v => { const m = v.match(/^(\d{1,2}):?(\d{2})$/); return m ? m[1].padStart(2, "0") + ":" + m[2] : ""; };
  s.open = tm(g("open")); s.close = tm(g("close"));
  s.closed = split(g("closed")).map(d => /^\d$/.test(d) ? +d : DAYS.indexOf(d.slice(0, 1))).filter(d => d >= 0 && d <= 6);
  const lmap = { 한국어: "ko", 영어: "en", 베트남어: "vi", 일본어: "ja", 중국어: "zh" };
  s.staffLangs = split(g("staffLangs")).map(l => lmap[l] || l.toLowerCase()).filter(l => STAFF.some(x => x[0] === l));
  s.rating = +g("rating") || 0; s.reviews = parseInt(g("reviews")) || 0;
  s.menu = split(g("menu"), /[;；]/).map(m => {
    const parts = m.split("|").map(x => (x || "").trim());
    // 새 양식: 한국어 | 영어 | 베트남어 | 분 | 가격  (예전 양식: 한국어 | 영어 | 분 | 가격)
    const [ko, en, vi, min, price] = parts.length >= 5 ? parts : [parts[0], parts[1], "", parts[2], parts[3]];
    return { name: { ko: ko || en || "", en: en || ko || "", vi: vi || "" }, min: parseInt(min) || 0, price: parseInt(String(price || "").replace(/[^\d]/g, "")) || 0 };
  }).filter(m => m.name.ko);
  return s;
}

async function importCSV(file) {
  const rows = parseCSV(decode(await file.arrayBuffer()));
  if (rows.length < 2) { toast("CSV에 내용이 없어요."); return; }
  const header = rows[0].map(h => h.replace(/^﻿/, "").trim());
  const keyOf = h => (COLS.find(c => c[1] === h || c[0] === h) || [])[0];
  const keys = header.map(keyOf);
  if (!keys.includes("name.ko") && !keys.includes("name.en")) { toast("양식이 달라요. '업로드 양식 받기'로 받은 파일을 써 주세요.", 4000); return; }
  const errs = [], add = [], upd = [];
  const seen = new Set();
  rows.slice(1).forEach((r, i) => {
    const obj = {}; keys.forEach((k, j) => { if (k) obj[k] = r[j] || ""; });
    const s = rowToShop(obj, i + 2, errs); if (!s) return;
    if (seen.has(s.id)) { errs.push(`${i + 2}번째 줄: 아이디 "${s.id}"가 파일 안에서 겹쳐요.`); return; }
    seen.add(s.id);
    (shops.some(x => x.id === s.id) ? upd : add).push(s);
  });
  const d = document.createElement("div"); d.className = "overlay center";
  d.innerHTML = `<div class="modal"><h2>업로드 미리보기</h2>
    <p>새 업체 <b>${add.length}</b>곳 · 기존 업체 덮어쓰기 <b>${upd.length}</b>곳${errs.length ? ` · 건너뜀 <b style="color:var(--danger)">${errs.length}</b>건` : ""}</p>
    ${add.length ? `<b>새로 추가</b><ul>${add.slice(0, 15).map(s => `<li>${esc(s.name.ko)} <small>(${esc(cityName(s.city))} · ${esc(catName(s.cat))})</small></li>`).join("")}${add.length > 15 ? `<li>외 ${add.length - 15}곳</li>` : ""}</ul>` : ""}
    ${upd.length ? `<b>덮어쓰기</b> <span class="hint">같은 아이디의 기존 정보가 파일 내용으로 바뀌어요. 사진주소 칸이 비어 있으면 기존 사진은 그대로 둬요.</span><ul>${upd.slice(0, 15).map(s => `<li>${esc(s.name.ko)} <small>(${esc(s.id)})</small></li>`).join("")}${upd.length > 15 ? `<li>외 ${upd.length - 15}곳</li>` : ""}</ul>` : ""}
    ${errs.length ? `<b style="color:var(--danger)">확인이 필요한 줄</b><ul class="err-text">${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    <div class="btns"><button class="btn" data-no>취소</button><button class="btn main" data-yes ${add.length + upd.length ? "" : "disabled"}>${add.length + upd.length}곳 적용</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("[data-no]").onclick = () => d.remove();
  d.querySelector("[data-yes]").onclick = () => {
    upd.forEach(s => { const i = shops.findIndex(x => x.id === s.id); if (!s.img) s.img = shops[i].img; if (!s.geo && shops[i].geo) { s.geo = shops[i].geo; if (shops[i].geoApprox) s.geoApprox = true; } if (shops[i].review) s.review = shops[i].review; shops[i] = s; changedIds.add(s.id); });
    add.forEach(s => { shops.push(s); changedIds.add(s.id); });
    d.remove(); markDirty(); drawList();
    toast(`${add.length + upd.length}곳을 적용했어요. '사이트에 반영'을 눌러 주세요.`, 3500);
  };
}

    const tree = [];
    for (const [path, text] of Object.entries(files)) {
      const b = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: textToB64(text), encoding: "base64" }) });
      tree.push({ path, mode: "100644", type: "blob", sha: b.sha });
    }
    for (const [path, blob] of Object.entries(imgs)) {
      const b = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: await blobToB64(blob), encoding: "base64" }) });
      tree.push({ path, mode: "100644", type: "blob", sha: b.sha });
    }
    const t = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: base.tree.sha, tree }) });
    const names = [...changedIds].map(id => (shops.find(x => x.id === id) || {}).name).filter(Boolean).map(n => n.ko || n.en).slice(0, 5);
    const msg = "관리자 페이지에서 수정" + (names.length ? ": " + names.join(", ") + (changedIds.size > 5 ? ` 외 ${changedIds.size - 5}곳` : "") : "") + (catChanged ? " · 카테고리 사진" : "");
    const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message: msg, tree: t.sha, parents: [head] }) });
    await gh(`/git/refs/heads/${GH.branch}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
    SHOPS.length = 0; SHOPS.push(...clone(shops)); BASE = JSON.stringify(SHOPS);
    Object.keys(CAT_IMGS).forEach(k => delete CAT_IMGS[k]); Object.assign(CAT_IMGS, clone(catImgs));
    dirty = false; changedIds.clear(); pendingImgs = {}; catChanged = false;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    drawList(); toast("저장했어요 ✅ 1~2분 뒤 사이트에 반영돼요.", 4000);
  } catch (e) {
    if (e.status === 401) { notice("err", "GitHub 토큰이 만료됐거나 맞지 않아요. 로그아웃한 뒤 새 토큰으로 다시 로그인해 주세요.", "nTok"); }
    else if (e.status === 403 || e.status === 404) { notice("err", "이 토큰에는 저장 권한이 없어요. 토큰을 만들 때 uncleday 저장소의 <b>Contents: Read and write</b>를 골랐는지 확인해 주세요.", "nPerm"); }
    else if (e.status === 409 || e.status === 422) { toast("다른 곳에서 동시에 저장했어요. 한 번 더 눌러 주세요.", 4000); }
    else toast("반영에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.", 4000);
  }
  btn.textContent = "사이트에 반영"; drawState();
}

    d.innerHTML = `<div class="modal"><h2>아직 사이트에 반영하지 않은 수정이 있어요</h2>
      <p class="hint">그냥 나가도 수정 내용은 이 브라우저에 임시 보관돼요. 다시 관리자 페이지에 오면 '불러오기'로 이어서 할 수 있어요. (새로 올린 사진은 다시 올려야 해요)</p>
      <div class="btns"><button class="btn" data-no>머무르기</button><button class="btn" data-go>그냥 나가기</button><button class="btn main" data-pub>반영하고 나가기</button></div></div>`;
    document.body.appendChild(d);
    d.querySelector("[data-no]").onclick = () => d.remove();
    d.querySelector("[data-go]").onclick = () => { location.href = a.href; };
    d.querySelector("[data-pub]").onclick = async () => { d.remove(); await publish(); if (!dirty) location.href = a.href; };
  });

  notice("info", `<details class="grow"><summary style="cursor:pointer"><b>엑셀(CSV) 업로드 양식 쓰는 법</b></summary><ul style="margin:8px 0 0;padding-left:18px">
    <li>'업로드 양식 받기'로 받은 파일에 한 줄에 한 업체씩 적어요. 엑셀에서 <b>CSV</b>로 저장해서 올려요.</li>
    <li>카테고리·지역은 한국어 이름 그대로 (예: <code>마사지</code>, <code>다낭</code>)</li>
    <li>아이디가 이미 있는 업체면 <b>덮어쓰기</b>, 없으면 <b>새로 추가</b>돼요. 아이디를 비우면 영어 이름으로 자동으로 만들어요.</li>
    <li>태그는 쉼표로 구분 · 휴무요일 <code>일,토</code> · 응대언어 <code>한국어,영어</code> · 입점확인 <code>Y</code> 또는 <code>N</code></li>
    <li>메뉴: <code>전신 마사지 | Full body | Massage toàn thân | 60 | 450000 ; 발 마사지 | Foot | Massage chân | 45 | 300000</code> (한국어 | 영어 | 베트남어 | 분 | 가격, 메뉴끼리는 <code>;</code>)</li>
    <li>사진은 업로드 후 각 업체 '수정'에서 올려요.</li></ul></details>`, "nHelp");

  // 임시 보관된 수정 불러오기
  let draft = null; try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
  if (draft && Array.isArray(draft.shops) && JSON.stringify(draft.shops) !== BASE) {
    const n = notice("warn", `<span class="grow">반영하지 않은 수정 내용이 남아 있어요.${draft.base !== BASE ? " (그 사이 사이트가 다시 저장됐어요. 불러오면 최신 저장본 위에 덮어써요.)" : ""} 새로 올린 사진은 다시 올려야 해요.</span>
      <button class="btn sm" data-a="load">불러오기</button><button class="btn sm" data-a="drop">버리기</button>`, "nDraft");
    n.querySelector('[data-a="load"]').onclick = () => {
      shops = draft.shops; (draft.changed || []).forEach(id => changedIds.add(id));
      shops.forEach(s => { if (s.img && s.img.startsWith("images/") && !SHOPS.some(o => o.img === s.img)) s.img = "";
        if (s.menuImgs) s.menuImgs = s.menuImgs.filter(m => !m.src.startsWith("images/") || SHOPS.some(o => (o.menuImgs || []).some(x => x.src === m.src))); });
      markDirty(); drawList(); n.remove();
    };
    n.querySelector('[data-a="drop"]').onclick = () => { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} n.remove(); };
  }
}

/* ===== GitHub 연결 (관리자 로그인) ===== */
const GH = { repo: "wootaengboy-hue/uncleday", branch: "main" };
const TOKEN_KEY = "uncleday-gh-token";
let ghToken = "";
async function gh(path, opt = {}) {
  const r = await fetch("https://api.github.com/repos/" + GH.repo + path, {
    ...opt, cache: "no-store",
    headers: { Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
      ...(opt.body ? { "Content-Type": "application/json" } : {}) }
  });
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));
const textToB64 = t => { const u = new TextEncoder().encode(t); let x = ""; for (let i = 0; i < u.length; i += 0x8000) x += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(x); };
const blobToB64 = b => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fail; r.readAsDataURL(b); });
async function readRepoData(path) {
  try {
    const f = await gh(`/contents/${path}?ref=${GH.branch}`);
    const t = b64ToText(f.content);
    return JSON.parse(t.slice(t.indexOf("=") + 1).trim().replace(/;\s*$/, ""));
  } catch (e) { if (e.status === 404) return null; throw e; }
}
// 사이트 파일은 몇 분간 예전 것이 보일 수 있어서, 관리자 화면은 GitHub에서 최신본을 바로 읽어요
async function loadFresh() {
  const [sh, ci, no] = await Promise.all([readRepoData("shops.js"), readRepoData("catimgs.js"), readRepoData("admin-notes.js")]);
  if (sh) { SHOPS.length = 0; SHOPS.push(...sh); }
  if (ci) { Object.keys(CAT_IMGS).forEach(k => delete CAT_IMGS[k]); Object.assign(CAT_IMGS, ci); }
  const notes = no || {};
  SHOPS.forEach(x => { delete x.review; delete x.checks; Object.assign(x, notes[x.id] || {}); });
  BASE = JSON.stringify(SHOPS); shops = clone(SHOPS); catImgs = clone(CAT_IMGS);
}
function getSavedToken() { try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function askLogin(onOk, why) {
  $("gate").hidden = false; $("app").hidden = true;
  $("gate").innerHTML = `<h1>관리자 로그인</h1><p>GitHub 토큰으로 로그인해요. 처음 한 번만 만들면 돼요.</p>
    ${why ? `<p class="err-text" style="margin-top:10px">${why}</p>` : ""}
    <form id="loginForm" style="display:grid;gap:10px;margin-top:18px;text-align:left">
      <label class="f"><span>GitHub 토큰</span><input id="lgTok" type="password" autocomplete="off" placeholder="github_pat_로 시작하는 긴 글자" required></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)"><input type="checkbox" id="lgKeep" checked> 이 기기에서 로그인 유지</label>
      <div class="err-text" id="lgErr"></div>
      <button class="btn main" type="submit" style="justify-content:center;padding:11px">로그인</button>
    </form>
    <details style="text-align:left;margin-top:16px;font-size:13px;color:var(--sub)"><summary style="cursor:pointer;font-weight:700;color:var(--text)">토큰 만드는 방법</summary>
      <ol style="padding-left:18px;line-height:1.7">
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> 를 열어요 (wootaengboy-hue로 로그인).</li>
        <li><b>Token name</b>: uncleday-admin, <b>Expiration</b>: 원하는 기간 (예: 1년)</li>
        <li><b>Repository access</b>: Only select repositories → <b>uncleday</b></li>
        <li><b>Permissions → Repository permissions → Contents</b>: <b>Read and write</b></li>
        <li><b>Generate token</b>을 누르고 나온 글자를 복사해서 위 칸에 붙여 넣어요.</li>
      </ol>
      <p>토큰은 이 기기 브라우저에만 저장되고 다른 곳으로 보내지 않아요. 비밀번호처럼 남에게 알려 주지 마세요.</p></details>
    <p style="margin-top:14px"><a href="./" style="color:var(--sub)">사이트로 돌아가기</a></p>`;
  $("lgTok").focus();
  $("loginForm").onsubmit = async e => {
    e.preventDefault();
    const tok = $("lgTok").value.trim(); if (!tok) return;
    $("lgErr").textContent = "확인 중…"; ghToken = tok;
    try {
      const info = await gh("");
      if (info.permissions && info.permissions.push === false) throw Object.assign(new Error(), { status: 403 });
      await loadFresh();
      try { ($("lgKeep").checked ? localStorage : sessionStorage).setItem(TOKEN_KEY, tok); } catch (err) {}
      onOk();
    } catch (err) {
      ghToken = "";
      $("lgErr").textContent = err.status === 401 ? "토큰이 맞지 않아요. 다시 복사해서 붙여 넣어 주세요."
        : (err.status === 403 || err.status === 404) ? "이 토큰으로는 uncleday 저장소에 접근할 수 없어요. 저장소 선택과 Contents 권한을 확인해 주세요."
        : "GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
    }
  };
}
function logout() {
  try { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  location.reload();
}

(async () => {
  const saved = getSavedToken();
  if (!saved) { askLogin(startApp); return; }
  ghToken = saved;
  try { await loadFresh(); startApp(); }
  catch (e) { ghToken = ""; askLogin(startApp, e.status === 401 ? "저장된 토큰이 만료됐어요. 새 토큰으로 로그인해 주세요." : "GitHub에서 최신 정보를 불러오지 못했어요. 다시 로그인해 주세요."); }
})();
</script>
